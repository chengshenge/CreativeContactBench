name: Evaluation pipeline CI

on:
  pull_request:
    paths:
      - "evaluation/**"
      - "multimodal/**"
      - ".github/workflows/evaluation-ci.yml"
  push:
    branches: [main]
    paths:
      - "evaluation/**"
      - "multimodal/**"
      - ".github/workflows/evaluation-ci.yml"

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: evaluation/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ./evaluation
      - run: python -m unittest discover -s evaluation/tests -v
      - run: pip install "numpy>=1.24,<3"
      - run: python -m unittest discover -s multimodal/tests -v
