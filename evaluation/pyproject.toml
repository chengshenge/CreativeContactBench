[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "creativecontactbench-eval"
version = "1.0.0"
description = "Standard VLM evaluation pipeline for CreativeContactBench"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "huggingface_hub>=1.0,<2",
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  "openai>=2.20,<3",
  "Pillow>=10,<13",
  "PyYAML>=6,<7",
]

[project.scripts]
ccbench-eval = "ccbench_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
